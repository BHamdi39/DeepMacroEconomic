<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0E1117" />
<title>غير متصل — مختبر الاقتصاد الكلي</title>
<style>
  :root { --bg:#0E1117; --surface:#161B22; --border:#2A3038; --ink:#F5F6F7; --muted:#9CA3AF; --accent:#5FD3C4; }
  body{font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
       background:var(--bg);color:var(--ink);
       display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center}
  .box{max-width:420px;padding:34px;border-radius:16px;background:var(--surface);
       border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.35)}
  h1{color:var(--accent);font-size:1.4rem}
  p{color:var(--muted);line-height:1.8}
  code{font-family:"JetBrains Mono",Consolas,monospace;color:var(--ink);background:#1E242C;
       padding:1px 6px;border-radius:6px;direction:ltr;unicode-bidi:isolate}
  a{color:var(--accent);font-weight:700}
</style>
</head>
<body>
  <div class="box">
    <div style="font-size:3rem">🔌</div>
    <h1>التطبيق غير متوفر حاليًا</h1>
    <p>خادم التطبيق لا يستجيب. تأكد من تشغيل النشر السحابي على Streamlit<br>
       أو شغّل المحاكي محليًا عبر <code>run.ps1</code> ثم أعد المحاولة.</p>
    <button onclick="window.parent.syncApp && window.parent.syncApp(); location.reload();" style="margin-top:14px;background:#5FD3C4;color:#0A0F14;border:0;border-radius:10px;padding:11px 26px;font-weight:700;font-family:inherit;font-size:.95rem;cursor:pointer">إعادة المحاولة</button>
  </div>
</body>
</html>

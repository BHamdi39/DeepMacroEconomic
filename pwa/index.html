<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="الاقتصاد الكلي" />
<meta name="theme-color" content="#0E1117" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#0E1117" />
<meta name="description" content="مختبر الاقتصاد الكلي المعمّق — تطبيق تعليمي تفاعلي يعمل محليًا" />
<title>مختبر الاقتصاد الكلي المعمّق</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="stylesheet" href="./fonts.css" />
<style>
  :root { --bg:#0E1117; --surface:#161B22; --border:#2A3038; --ink:#F5F6F7; --muted:#9CA3AF; --accent:#5FD3C4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "IBM Plex Sans Arabic", "Segoe UI", "Tahoma", "Arial", sans-serif;
    background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #15262E, #0E1117);
    color: #fff; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px; padding-top: max(10px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 10px rgba(0,0,0,.35); z-index: 10;
  }
  header .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.02rem; min-width: 0; }
  header .brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .brand bdi { color: var(--accent); }
  header img { width: 34px; height: 34px; border-radius: 8px; flex: none; }
  header .actions { display: flex; gap: 8px; align-items: center; flex: none; }
  .install-btn {
    display: none; background: var(--accent); color: #0A0F14; border: none;
    border-radius: 8px; padding: 7px 14px; font-weight: 700; font-size: .9rem;
    cursor: pointer; align-items: center; gap: 7px;
  }
  .install-btn.show { display: inline-flex; }
  .install-btn:hover { filter: brightness(1.08); }
  .server-pill {
    background:#ffffff14; border:1px solid #ffffff33; border-radius: 999px;
    padding: 4px 12px; font-size: .78rem; color: #cfe3ef;
  }
  .net-pill { background:#ffffff1f; border-radius:999px; padding:3px 10px; font-size:.74rem; }
  .net-pill.offline { color:#ffd9a3; }
  main { flex: 1; position: relative; }
  iframe {
    width: 100%; height: 100%; border: 0; display: block;
    background: var(--bg);
  }
  .offline { display: none; }
  .busy {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: var(--bg); color: var(--muted); font-size: 1rem; flex-direction: column; gap: 10px;
  }
  body.loading .busy { display: flex; }
  @media (max-width: 480px) {
    header { padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); }
    header .brand { font-size: .88rem; gap: 7px; }
    header img { width: 30px; height: 30px; }
    .install-btn { padding: 6px 10px; font-size: .8rem; }
    .server-pill, .net-pill { font-size: .68rem; padding: 3px 8px; }
  }
  @media (max-width: 380px) {
    .server-pill, .net-pill { display: none; }
  }
  @media (max-width: 800px) {
    .net-pill, .server-pill { white-space: nowrap; }
  }
</style>
</head>
<body class="loading">
<header>
  <div class="brand">
    <img src="./icon-192.png" alt="" />
    <span><bdi>مختبر الاقتصاد الكلي المعمّق</bdi></span>
  </div>
  <div class="actions">
    <span class="server-pill" id="serverPill">المحاكي قيد الإقلاع…</span>
    <span class="net-pill" id="netPill" hidden></span>
    <button id="install" class="install-btn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 3a1 1 0 0 1 1 1v8.59l3.3-3.3a1 1 0 1 1 1.4 1.42l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.42l3.3 3.3V4a1 1 0 0 1 1-1ZM5 17a1 1 0 0 1 1 1v1h12v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1Z"/></svg>
      <span>تثبيت التطبيق</span>
    </button>
  </div>
</header>
<main>
  <div class="busy">⏳ جارٍ تشغيل المحاكي التفاعلي…</div>
  <iframe id="app"
          src=""
          allow="clipboard-write"
          sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads"
          title="التطبيق التفاعلي"></iframe>
</main>

<script>
  // الوضع الداكن هو الوضع الافتراضي للتطبيق الآن (يطابق أسلوب style.jpg).
  // ⚠️ بعد نشر التطبيق على Streamlit Community Cloud، ضع رابط النشر في APP_URL:
  //     e.g. APP_URL = "https://deepmacroeconomic.streamlit.app/?embed=true&toolbar_hide=true&theme=dark"
  // واتركه فارغًا للتشغيل المحلي (localhost:8508) عبر run.ps1.
  const APP_URL = ""; // ← ضع رابط النشر هنا بعد النشر
  const LOCAL_URL = "http://localhost:8508/?embed=true&toolbar_hide=true&theme=dark";
  const TARGET_URL = APP_URL && APP_URL.startsWith("http") ? APP_URL : LOCAL_URL;
  const APP_ORIGIN = new URL(TARGET_URL).origin;
  const frame = document.getElementById("app");
  const pill = document.getElementById("serverPill");

  function checkServer() {
    // no-cors: لا نحتاج قراءة الرد بل مجرد معرفة وصول الخادم (غير قابل للقراءة مقبول).
    fetch(APP_ORIGIN + "/_stcore/health", { mode: "no-cors" })
      .then(() => {
        if (frame.src !== TARGET_URL) frame.src = TARGET_URL;
        pill.textContent = "المحاكي يعمل ●";
        document.body.classList.remove("loading");
      })
      .catch(() => {
        pill.textContent = "⚠ المحاكي متوقف — شغّل run.ps1 (أو تأكد من نشر التطبيق)";
        frame.src = "offline.html";
      });
  }
  checkServer();
  setInterval(checkServer, 5000);

  // حالة الشبكة
  const netPill = document.getElementById("netPill");
  function netState() {
    const on = navigator.onLine;
    netPill.hidden = false;
    netPill.textContent = on ? "متصل" : "غير متصل";
    netPill.classList.toggle("offline", !on);
  }
  window.addEventListener("online", netState);
  window.addEventListener("offline", netState);
  netState();

  // دفع التثبيت (قابل التطبيق خلف أي الخادمات)
  let deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById("install").classList.add("show");
  });
  document.getElementById("install").addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById("install").classList.remove("show");
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch((e) => console.error("SW:", e));
    });
  }
</script>
</body>
</html>
